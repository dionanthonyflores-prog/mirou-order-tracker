# Runs every automated test on GitHub's computers each time code is pushed.
# If ALL tests pass, it publishes the tracker (demo mode) and the test report to GitHub Pages.
# If ANY test fails, nothing is published and the live version stays on the last good one (a "quality gate").
name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:                  # never publish two versions at the same time
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Run unit tests and Playwright tests (Android, iPhone, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the test tools
        run: npm ci

      - name: Install the test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run the unit tests (prices, totals, status, dates)
        run: npm run test:unit

      - name: Run the end-to-end tests
        run: npx playwright test

      - name: Keep the test report, even if tests failed
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # The steps below only run when every test passed, and only for the main branch
      - name: Put the tracker and the test report together
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/
          cp -r playwright-report _site/report

      - name: Package it for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    name: Publish to GitHub Pages
    needs: test               # waits for the tests; skipped if they failed
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
